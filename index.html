<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGq  Po1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
    <form action="">
        <h2>Login Form</h2>

        <div>
            <label  for="name">Name<span>*</span></label>
            <input  type="text" placeholder="Name" class="req"/>
            <small>This field is required</small>
        </div>

        <div>
            <label for="email">Email<span>*</span></label>
            <input  type="email" placeholder="Email" class="req"/>
            <small>This field is required</small>
        </div>

        <div class="pass-wrapper">
            <label  for="password">Password<span>*</span></label>
            <input  type="password" placeholder="Password" class="req"/>
             <i class="far fa-eye"></i>
            <small>This field is required</small>
        </div>

        <div>
            <label for="age">Age</label>
            <input  type="age" placeholder="Age"/>
        </div>

        <button>Submit</button>

    </form>
    <script src="../js/script.js"></script>
   
</body>
</html>
